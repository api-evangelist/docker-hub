apis:
- aid: docker-hub:docker-hub-access-tokens-api
  name: Docker Hub access-tokens API
  description: >-
    The Personal Access Token endpoints lets you manage personal access tokens. For more information,
    see [Access Tokens](https://docs.docker.com/security/access-tokens/).


    You can use a personal access token instead of a password in the [Docker CLI](https://docs.docker.com/engine/reference/commandline/cli/)
    or in the [Create an authentication token](#operation/PostUsersLogin) route to obtain a bearer token.


    ### Scopes


    For each scope grouping (in this case "repo"), you only need to define 1 scope as any lower scopes
    are assumed.

    For example: If you define `repo:write`, the API assumes the scope of both `repo:read` *and* `repo:public_read`
    as well.

    If you were to define both `repo:write` *and* `repo:read`, then `repo:read` is assumed by `repo:write`
    and ignored.


    ***Treat your personal access token like your password and keep it secret. You cannot retrieve your
    token after it is generated.***
  humanURL: https://docs.docker.com/docker-hub/api/latest/
  baseURL: https://hub.docker.com/v2
  tags:
  - access-tokens
  properties:
  - type: OpenAPI
    url: openapi/docker-hub-access-tokens-api-openapi.yml
  - type: Documentation
    url: https://docs.docker.com/docker-hub/api/latest/
  - type: BaseURL
    url: https://hub.docker.com/v2
