    resources:
    - name: v2-access-tokens
      path: /v2/access-tokens
      operations:
      - name: post
        method: POST
        description: Create personal access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: get
        method: GET
        description: List personal access tokens
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: number
        - name: page_size
          in: query
          type: number
