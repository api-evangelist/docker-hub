        name: get
        description: Get personal access token
        call: docker-hub-access-tokens.get
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete
        description: Delete personal access token
        call: docker-hub-access-tokens.delete
        outputParameters:
        - type: object
          mapping: $.
