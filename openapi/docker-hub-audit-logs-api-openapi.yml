      parameters:
      - name: account
        description: Namespace to query audit log actions for.
        in: path
        required: true
        schema:
          type: string
      tags:
      - audit-logs
  /v2/auditlogs/{account}:
    get:
      summary: List audit log events
      description: 'List audit log events for a given namespace.


        <span class="oat"></span>

        '
      operationId: AuditLogs_ListAuditLogs
      security:
      - bearerAuth: []
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuditLogsResponse'
              examples:
                response:
                  value:
                    logs:
                    - account: docker
                      action: repo.tag.push
                      name: docker/example
                      actor: docker
                      data:
                        digest: sha256:c1ae9c435032a276f80220c7d9b40f76266bbe79243d34f9cda30b76fe114dfa
                        tag: latest
                      timestamp: '2021-02-19T01:34:35Z'
                      action_description: 'pushed the tag latest with the digest sha256:c1ae9c435032a to the repository docker/example

                        '
        '429':
          description: ''
          content:
            application/json:
              schema: {}
              examples:
                response:
                  value:
                    detail: Rate limit exceeded
                    error: false
        '500':
          description: ''
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: account
        description: Namespace to query audit logs for.
        in: path
        required: true
        schema:
          type: string
      - name: action
        description: 'action name one of ["repo.tag.push", ...]. Optional parameter to filter specific audit log actions.

          '
        in: query
        required: false
        schema:
          type: string
      - name: name
        description: 'name. Optional parameter to filter audit log events to a specific name. For repository events, this is the name of the repository. For organization events, this is the name of the organization. For team member events, this is the username of the team member.

          '
        in: query
        required: false
        schema:
          type: string
      - name: actor
        description: 'actor name. Optional parameter to filter audit log events to the specific user who triggered the event.

          '
        in: query
        required: false
        schema:
          type: string
      - name: from
        description: Start of the time window you wish to query audit events for.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        description: End of the time window you wish to query audit events for.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        description: page - specify page number. Page number to get.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        description: page_size - specify page size. Number of events to return per page.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      tags:
      - audit-logs
components:
  schemas:
    rpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/protobufAny'
    GetAuditActionsResponse:
      type: object
      properties:
        actions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AuditLogActions'
          description: Map of audit log actions.
      description: GetAuditActions response.
    GetAuditLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
          description: List of audit log events.
      description: GetAuditLogs response.
    AuditLogActions:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogAction'
          description: List of audit log actions.
        label:
          type: string
          description: Grouping label for a particular set of audit log actions.
    protobufAny:
      type: object
      properties:
        type_url:
          type: string
        value:
          type: string
          format: byte
    AuditLogAction:
      type: object
      properties:
        name:
          type: string
          description: Name of audit log action.
        description:
          type: string
          description: Description of audit log action.
        label:
          type: string
          description: Label for audit log action.
      description: Audit Log action
    AuditLog:
      type: object
      properties:
        account:
          type: string
        action:
          type: string
        name:
          type: string
        actor:
          type: string
        data:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string
          format: date-time
        action_description:
          type: string
      description: Audit log event.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bearerSCIMAuth:
      type: http
      scheme: bearer
x-tagGroups:
- name: General
  tags:
  - changelog
  - resources
  - rate-limiting
  - authentication
- name: API
  tags:
  - authentication-api
  - access-tokens
  - images
  - audit-logs
  - org-settings
  - repositories
  - scim
  - orgs
  - org-access-tokens
  - groups
  - invites
