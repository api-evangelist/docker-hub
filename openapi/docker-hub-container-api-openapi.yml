          type: object
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
    ContainerSummary:
      type: array
      items:
        type: object
        properties:
          Id:
            description: The ID of this container
            type: string
            x-go-name: ID
          Names:
            description: The names that this container has been given
            type: array
            items:
              type: string
          Image:
            description: The name of the image used when creating this container
            type: string
          ImageID:
            description: The ID of the image that this container was created from
            type: string
          Command:
            description: Command to run when starting the container
            type: string
          Created:
            description: When the container was created
            type: integer
            format: int64
          Ports:
            description: The ports exposed by this container
            type: array
            items:
              $ref: '#/components/schemas/Port'
          SizeRw:
            description: The size of files that have been created or changed by this container
            type: integer
            format: int64
          SizeRootFs:
            description: The total size of all the files in this container
            type: integer
            format: int64
          Labels:
            description: User-defined key/value metadata.
            type: object
            additionalProperties:
              type: string
          State:
            description: The state of this container (e.g. `Exited`)
            type: string
          Status:
            description: Additional human-readable status of this container (e.g. `Exit 0`)
            type: string
          HostConfig:
            type: object
            properties:
              NetworkMode:
                type: string
          NetworkSettings:
            description: A summary of the container's network settings
            type: object
            properties:
              Networks:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/EndpointSettings'
          Mounts:
            type: array
            items:
              $ref: '#/components/schemas/Mount'
    HostConfig:
      description: Container configuration that depends on the host we are running on
      allOf:
      - $ref: '#/components/schemas/Resources'
      - type: object
        properties:
          Binds:
            type: array
            description: 'A list of volume bindings for this container. Each volume binding is a string in one of these forms:


              - `host-src:container-dest` to bind-mount a host path into the container. Both `host-src`, and `container-dest` must be an _absolute_ path.

              - `host-src:container-dest:ro` to make the bind mount read-only inside the container. Both `host-src`, and `container-dest` must be an _absolute_ path.

              - `volume-name:container-dest` to bind-mount a volume managed by a volume driver into the container. `container-dest` must be an _absolute_ path.

              - `volume-name:container-dest:ro` to mount the volume read-only inside the container.  `container-dest` must be an _absolute_ path.

              '
            items:
              type: string
          ContainerIDFile:
            type: string
            description: Path to a file where the container ID is written
          LogConfig:
            type: object
            description: The logging configuration for this container
            properties:
              Type:
                type: string
                enum:
                - json-file
                - syslog
                - journald
                - gelf
                - fluentd
                - awslogs
                - splunk
                - etwlogs
                - none
              Config:
                type: object
                additionalProperties:
                  type: string
          NetworkMode:
            type: string
            description: 'Network mode to use for this container. Supported standard values are: `bridge`, `host`, `none`, and `container:<name|id>`. Any other value is taken as a custom network''s name to which this container should connect to.'
          PortBindings:
            type: object
            description: A map of exposed container ports and the host port they should map to.
            additionalProperties:
              type: object
              properties:
                HostIp:
                  type: string
                  description: The host IP address
                HostPort:
                  type: string
                  description: The host port number, as a string
          RestartPolicy:
            $ref: '#/components/schemas/RestartPolicy'
          AutoRemove:
            type: boolean
            description: Automatically remove the container when the container's process exits. This has no effect if `RestartPolicy` is set.
          VolumeDriver:
            type: string
            description: Driver that this container uses to mount volumes.
          VolumesFrom:
            type: array
            description: A list of volumes to inherit from another container, specified in the form `<container name>[:<ro|rw>]`.
            items:
              type: string
          Mounts:
            description: Specification for mounts to be added to the container.
            type: array
            items:
              $ref: '#/components/schemas/Mount'
          CapAdd:
            type: array
            description: A list of kernel capabilities to add to the container.
            items:
              type: string
          CapDrop:
            type: array
            description: A list of kernel capabilities to drop from the container.
            items:
              type: string
          Dns:
            type: array
            description: A list of DNS servers for the container to use.
            items:
              type: string
          DnsOptions:
            type: array
            description: A list of DNS options.
            items:
              type: string
          DnsSearch:
            type: array
            description: A list of DNS search domains.
            items:
              type: string
          ExtraHosts:
            type: array
            description: 'A list of hostnames/IP mappings to add to the container''s `/etc/hosts` file. Specified in the form `["hostname:IP"]`.

              '
            items:
              type: string
          GroupAdd:
            type: array
            description: A list of additional groups that the container process will run as.
            items:
              type: string
          IpcMode:
            type: string
            description: 'IPC sharing mode for the container. Possible values are:


              - `"none"`: own private IPC namespace, with /dev/shm not mounted

              - `"private"`: own private IPC namespace

              - `"shareable"`: own private IPC namespace, with a possibility to share it with other containers

              - `"container:<name|id>"`: join another (shareable) container''s IPC namespace

              - `"host"`: use the host system''s IPC namespace


              If not specified, daemon default is used, which can either be `"private"`

              or `"shareable"`, depending on daemon version and configuration.

              '
          Cgroup:
            type: string
            description: Cgroup to use for the container.
          Links:
            type: array
            description: A list of links for the container in the form `container_name:alias`.
            items:
              type: string
          OomScoreAdj:
            type: integer
            description: An integer value containing the score given to the container in order to tune OOM killer preferences.
            example: 500
          PidMode:
            type: string
            description: 'Set the PID (Process) Namespace mode for the container. It can be either:


              - `"container:<name|id>"`: joins another container''s PID namespace

              - `"host"`: use the host''s PID namespace inside the container

              '
          Privileged:
            type: boolean
            description: Gives the container full access to the host.
          PublishAllPorts:
            type: boolean
            description: Allocates a random host port for all of a container's exposed ports.
          ReadonlyRootfs:
            type: boolean
            description: Mount the container's root filesystem as read only.
          SecurityOpt:
            type: array
            description: A list of string values to customize labels for MLS systems, such as SELinux.
            items:
              type: string
          StorageOpt:
            type: object
            description: 'Storage driver options for this container, in the form `{"size": "120G"}`.

              '
            additionalProperties:
              type: string
          Tmpfs:
            type: object
            description: 'A map of container directories which should be replaced by tmpfs mounts, and their corresponding mount options. For example: `{ "/run": "rw,noexec,nosuid,size=65536k" }`.

              '
            additionalProperties:
              type: string
          UTSMode:
            type: string
            description: UTS namespace to use for the container.
          UsernsMode:
            type: string
            description: Sets the usernamespace mode for the container when usernamespace remapping option is enabled.
          ShmSize:
            type: integer
            description: Size of `/dev/shm` in bytes. If omitted, the system uses 64MB.
            minimum: 0
          Sysctls:
            type: object
            description: 'A list of kernel parameters (sysctls) to set in the container. For example: `{"net.ipv4.ip_forward": "1"}`

              '
            additionalProperties:
              type: string
          Runtime:
            type: string
            description: Runtime to use with this container.
          ConsoleSize:
            type: array
            description: Initial console size, as an `[height, width]` array. (Windows only)
            minItems: 2
            maxItems: 2
            items:
              type: integer
              minimum: 0
          Isolation:
            type: string
            description: Isolation technology of the container. (Windows only)
            enum:
            - default
            - process
            - hyperv
    DeviceMapping:
      type: object
      description: A device mapping between the host and container
      properties:
        PathOnHost:
          type: string
        PathInContainer:
          type: string
        CgroupPermissions:
          type: string
      example:
        PathOnHost: /dev/deviceName
        PathInContainer: /dev/deviceName
        CgroupPermissions: mrw
    ContainerConfig:
      description: Configuration for a container that is portable between hosts
      type: object
      properties:
        Hostname:
          description: The hostname to use for the container, as a valid RFC 1123 hostname.
          type: string
        Domainname:
          description: The domain name to use for the container.
          type: string
        User:
          description: The user that commands are run as inside the container.
          type: string
        AttachStdin:
          description: Whether to attach to `stdin`.
          type: boolean
          default: false
        AttachStdout:
          description: Whether to attach to `stdout`.
          type: boolean
          default: true
        AttachStderr:
          description: Whether to attach to `stderr`.
          type: boolean
          default: true
        ExposedPorts:
          description: 'An object mapping ports to an empty object in the form:


            `{"<port>/<tcp|udp>": {}}`

            '
          type: object
          additionalProperties:
            type: object
            enum:
            - {}
            default: {}
        Tty:
          description: Attach standard streams to a TTY, including `stdin` if it is not closed.
          type: boolean
          default: false
        OpenStdin:
          description: Open `stdin`
          type: boolean
          default: false
        StdinOnce:
          description: Close `stdin` after one attached client disconnects
          type: boolean
          default: false
        Env:
          description: 'A list of environment variables to set inside the container in the form `["VAR=value", ...]`. A variable without `=` is removed from the environment, rather than to have an empty value.

            '
          type: array
          items:
            type: string
        Cmd:
          description: Command to run specified as a string or an array of strings.
          type:
          - array
          - string
          items:
            type: string
        Healthcheck:
          $ref: '#/components/schemas/HealthConfig'
        ArgsEscaped:
          description: Command is already escaped (Windows only)
          type: boolean
        Image:
          description: The name of the image to use when creating the container
          type: string
        Volumes:
          description: An object mapping mount point paths inside the container to empty objects.
          type: object
          properties:
            additionalProperties:
              type: object
              enum:
              - {}
              default: {}
        WorkingDir:
          description: The working directory for commands to run in.
          type: string
        Entrypoint:
          description: 'The entry point for the container as a string or an array of strings.


            If the array consists of exactly one empty string (`[""]`) then the entry point is reset to system default (i.e., the entry point used by docker when there is no `ENTRYPOINT` instruction in the `Dockerfile`).

            '
          type:
          - array
          - string
          items:
            type: string
        NetworkDisabled:
          description: Disable networking for the container.
          type: boolean
        MacAddress:
          description: MAC address of the container.
          type: string
        OnBuild:
          description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.'
          type: array
          items:
            type: string
        Labels:
          description: User-defined key/value metadata.
          type: object
          additionalProperties:
            type: string
        StopSignal:
          description: Signal to stop a container as a string or unsigned integer.
          type: string
          default: SIGTERM
        StopTimeout:
          description: Timeout to stop a container in seconds.
          type: integer
          default: 10
        Shell:
          description: Shell for when `RUN`, `CMD`, and `ENTRYPOINT` uses a shell.
          type: array
          items:
            type: string
    PortBinding:
      description: 'PortBinding represents a binding between a host IP address and a host

        port.

        '
      type:
      - object
      - 'null'
      properties:
        HostIp:
          description: Host IP address that the container's port is mapped to.
          type: string
          example: 127.0.0.1
        HostPort:
          description: Host port number that the container's port is mapped to.
          type: string
          example: '4443'
    HealthConfig:
      description: A test to perform to check that the container is healthy.
      type: object
      properties:
        Test:
          description: 'The test to perform. Possible values are:


            - `[]` inherit healthcheck from image or parent image

            - `["NONE"]` disable healthcheck

            - `["CMD", args...]` exec arguments directly

            - `["CMD-SHELL", command]` run command with system''s default shell

            '
          type: array
          items:
            type: string
        Interval:
          description: The time to wait between checks in nanoseconds. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
          type: integer
        Timeout:
          description: The time to wait before considering the check to have hung. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
          type: integer
        Retries:
          description: The number of consecutive failures needed to consider a container as unhealthy. 0 means inherit.
          type: integer
        StartPeriod:
          description: Start period for the container to initialize before starting health-retries countdown in nanoseconds. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
          type: integer
    EndpointIPAMConfig:
      description: 'EndpointIPAMConfig represents an endpoint''s IPAM configuration.

        '
      type:
      - object
      - 'null'
      properties:
        IPv4Address:
          type: string
          example: 172.20.30.33
        IPv6Address:
          type: string
          example: 2001:db8:abcd::3033
        LinkLocalIPs:
          type: array
          items:
            type: string
          example:
          - 169.254.34.68
          - fe80::3468
    RestartPolicy:
      description: 'The behavior to apply when the container exits. The default is not to restart.


        An ever increasing delay (double the previous delay, starting at 100ms) is added before each restart to prevent flooding the server.

        '
      type: object
      properties:
        Name:
          type: string
          description: '- Empty string means not to restart

            - `always` Always restart

            - `unless-stopped` Restart always except when the user has manually stopped the container

            - `on-failure` Restart only when the container exit code is non-zero

            '
          enum:
          - ''
          - always
          - unless-stopped
          - on-failure
        MaximumRetryCount:
          type: integer
          description: If `on-failure` is used, the number of times to retry before giving up
    ErrorResponse:
      description: Represents an error.
      type: object
      required:
      - message
      properties:
        message:
          description: The error message.
          type: string
      example:
        message: Something went wrong.
    EndpointSettings:
      description: Configuration for a network endpoint.
      type: object
      properties:
        IPAMConfig:
          $ref: '#/components/schemas/EndpointIPAMConfig'
        Links:
          type: array
          items:
            type: string
          example:
          - container_1
          - container_2
        Aliases:
          type: array
          items:
            type: string
          example:
          - server_x
          - server_y
        NetworkID:
          description: 'Unique ID of the network.

            '
          type: string
          example: 08754567f1f40222263eab4102e1c733ae697e8e354aa9cd6e18d7402835292a
        EndpointID:
          description: 'Unique ID for the service endpoint in a Sandbox.

            '
          type: string
          example: b88f5b905aabf2893f3cbc4ee42d1ea7980bbc0a92e2c8922b1e1795298afb0b
        Gateway:
          description: 'Gateway address for this network.

            '
          type: string
          example: 172.17.0.1
        IPAddress:
          description: 'IPv4 address.

            '
          type: string
          example: 172.17.0.4
        IPPrefixLen:
          description: 'Mask length of the IPv4 address.

            '
          type: integer
          example: 16
        IPv6Gateway:
          description: 'IPv6 gateway address.

            '
          type: string
          example: 2001:db8:2::100
        GlobalIPv6Address:
          description: 'Global IPv6 address.

            '
          type: string
          example: 2001:db8::5689
        GlobalIPv6PrefixLen:
          description: 'Mask length of the global IPv6 address.

            '
          type: integer
          format: int64
          example: 64
        MacAddress:
          description: 'MAC address for the endpoint on this network.

            '
          type: string
          example: 02:42:ac:11:00:04
        DriverOpts:
          description: 'DriverOpts is a mapping of driver options and values. These options

            are passed directly to the driver and are driver specific.

            '
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          example:
            com.example.some-label: some-value
            com.example.some-other-label: some-other-value
    Address:
      description: Address represents an IPv4 or IPv6 IP address.
      type: object
      properties:
        Addr:
          description: IP address.
          type: string
        PrefixLen:
          description: Mask length of the IP address.
          type: integer
    PortMap:
      description: 'PortMap describes the mapping of container ports to host ports, using the

        container''s port-number and protocol as key in the format `<port>/<protocol>`,

        for example, `80/udp`.


        If a container''s port is mapped for both `tcp` and `udp`, two separate

        entries are added to the mapping table.

        '
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/PortBinding'
      example:
        443/tcp:
        - HostIp: 127.0.0.1
          HostPort: '4443'
        80/tcp:
        - HostIp: 0.0.0.0
          HostPort: '80'
        - HostIp: 0.0.0.0
          HostPort: '8080'
        80/udp:
        - HostIp: 0.0.0.0
          HostPort: '80'
        53/udp:
        - HostIp: 0.0.0.0
          HostPort: '53'
        2377/tcp: null
    Mount:
      type: object
      properties:
        Target:
          description: Container path.
          type: string
        Source:
          description: Mount source (e.g. a volume name, a host path).
          type: string
        Type:
          description: 'The mount type. Available types:


            - `bind` Mounts a file or directory from the host into the container. Must exist prior to creating the container.

            - `volume` Creates a volume with the given name and options (or uses a pre-existing volume with the same name and options). These are **not** removed when the container is removed.

            - `tmpfs` Create a tmpfs with the given options. The mount source cannot be specified for tmpfs.

            '
          type: string
          enum:
          - bind
          - volume
          - tmpfs
        ReadOnly:
          description: Whether the mount should be read-only.
          type: boolean
        Consistency:
          description: 'The consistency requirement for the mount: `default`, `consistent`, `cached`, or `delegated`.'
          type: string
        BindOptions:
          description: Optional configuration for the `bind` type.
          type: object
          properties:
            Propagation:
              description: A propagation mode with the value `[r]private`, `[r]shared`, or `[r]slave`.
              enum:
              - private
              - rprivate
              - shared
              - rshared
              - slave
              - rslave
        VolumeOptions:
          description: Optional configuration for the `volume` type.
          type: object
          properties:
            NoCopy:
              description: Populate volume with data from the target.
              type: boolean
              default: false
            Labels:
              description: User-defined key/value metadata.
              type: object
              additionalProperties:
                type: string
            DriverConfig:
              description: Map of driver specific options
              type: object
              properties:
                Name:
                  description: Name of the driver to use to create the volume.
                  type: string
                Options:
                  description: key/value map of driver specific options.
                  type: object
                  additionalProperties:
                    type: string
        TmpfsOptions:
          description: Optional configuration for the `tmpfs` type.
          type: object
          properties:
            SizeBytes:
              description: The size for the tmpfs mount in bytes.
              type: integer
              format: int64
            Mode:
              description: The permission mode for the tmpfs mount in an integer.
              type: integer
    MountPoint:
      type: object
      description: A mount point inside a container
      properties:
        Type:
          type: string
        Name:
          type: string
        Source:
          type: string
        Destination:
          type: string
        Driver:
          type: string
        Mode:
          type: string
        RW:
          type: boolean
        Propagation:
          type: string
