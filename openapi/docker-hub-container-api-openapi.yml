  /containers/{id}/archive:
    head:
      summary: Get information about files in a container
      description: A response header `X-Docker-Container-Path-Stat` is return containing a base64 - encoded JSON object with some filesystem header information about the path.
      operationId: ContainerArchiveInfo
      responses:
        200:
          description: no error
          headers:
            X-Docker-Container-Path-Stat:
              description: TODO
              schema:
                type: string
        400:
          description: Bad parameter
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  properties:
                    message:
                      description: The error message. Either "must specify path parameter" (path cannot be empty) or "not a directory" (path was asserted to be a directory but exists as a file).
                      type: string
            text/plain:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  properties:
                    message:
                      description: The error message. Either "must specify path parameter" (path cannot be empty) or "not a directory" (path was asserted to be a directory but exists as a file).
                      type: string
        404:
          description: Container or path does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'No such container: c2ada9df5af8'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        schema:
          type: string
      - name: path
        in: query
        required: true
        description: Resource in the container’s filesystem to archive.
        schema:
          type: string
      tags:
      - Container
    get:
      summary: Get an archive of a filesystem resource in a container
      description: Get a tar archive of a resource in the filesystem of container id.
      operationId: ContainerArchive
      responses:
        200:
          description: no error
        400:
          description: Bad parameter
          content:
            application/x-tar:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  properties:
                    message:
                      description: The error message. Either "must specify path parameter" (path cannot be empty) or "not a directory" (path was asserted to be a directory but exists as a file).
                      type: string
        404:
          description: Container or path does not exist
          content:
            application/x-tar:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: server error
          content:
            application/x-tar:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        schema:
          type: string
      - name: path
        in: query
        required: true
        description: Resource in the container’s filesystem to archive.
        schema:
          type: string
      tags:
      - Container
    put:
      summary: Extract an archive of files or folders to a directory in a container
      description: Upload a tar archive to be extracted to a path in the filesystem of container id.
      operationId: PutContainerArchive
      responses:
        200:
          description: The content was extracted successfully
        400:
          description: Bad parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Permission denied, the volume or container rootfs is marked as read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: No such container or path does not exist inside the container
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'No such container: c2ada9df5af8'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        schema:
          type: string
      - name: path
        in: query
        required: true
        description: 'Path to a directory in the container to extract the archive’s contents into. '
        schema:
          type: string
      - name: noOverwriteDirNonDir
        in: query
        description: If “1”, “true”, or “True” then it will be an error if unpacking the given content would cause an existing directory to be replaced with a non-directory and vice versa.
        schema:
          type: string
      tags:
      - Container
      requestBody:
        content:
          application/x-tar:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
        description: 'The input stream must be a tar archive compressed with one of the following algorithms: identity (no compression), gzip, bzip2, xz.'
        required: true
  /containers/prune:
    post:
      summary: Delete stopped containers
      operationId: ContainerPrune
      parameters:
      - name: filters
        in: query
        description: 'Filters to process on the prune list, encoded as JSON (a `map[string][]string`).


          Available filters:

          - `until=<timestamp>` Prune containers created before this timestamp. The `<timestamp>` can be Unix timestamps, date formatted timestamps, or Go duration strings (e.g. `10m`, `1h30m`) computed relative to the daemon machine’s time.

          - `label` (`label=<key>`, `label=<key>=<value>`, `label!=<key>`, or `label!=<key>=<value>`) Prune containers with (or without, in case `label!=...` is used) the specified labels.

          '
        schema:
          type: string
      responses:
        200:
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ContainersDeleted:
                    description: Container IDs that were deleted
                    type: array
                    items:
                      type: string
                  SpaceReclaimed:
                    description: Disk space reclaimed in bytes
                    type: integer
                    format: int64
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Container
components:
  schemas:
    Port:
      type: object
      description: An open port on a container
      required:
      - PrivatePort
      - Type
      properties:
        IP:
          type: string
          format: ip-address
        PrivatePort:
          type: integer
          format: uint16
          description: Port on the container
        PublicPort:
          type: integer
          format: uint16
          description: Port exposed on the host
        Type:
          type: string
          enum:
          - tcp
          - udp
      example:
        PrivatePort: 8080
        PublicPort: 80
        Type: tcp
    ThrottleDevice:
      type: object
      properties:
        Path:
          description: Device path
          type: string
        Rate:
          description: Rate
          type: integer
          format: int64
          minimum: 0
    Resources:
      description: A container's resources (cgroups config, ulimits, etc)
      type: object
      properties:
        CpuShares:
          description: An integer value representing this container's relative CPU weight versus other containers.
          type: integer
        Memory:
          description: Memory limit in bytes.
          type: integer
          default: 0
        CgroupParent:
          description: Path to `cgroups` under which the container's `cgroup` is created. If the path is not absolute, the path is considered to be relative to the `cgroups` path of the init process. Cgroups are created if they do not already exist.
          type: string
        BlkioWeight:
          description: Block IO weight (relative weight).
          type: integer
          minimum: 0
          maximum: 1000
        BlkioWeightDevice:
          description: 'Block IO weight (relative device weight) in the form `[{"Path": "device_path", "Weight": weight}]`.

            '
          type: array
          items:
            type: object
            properties:
              Path:
                type: string
              Weight:
                type: integer
                minimum: 0
        BlkioDeviceReadBps:
          description: 'Limit read rate (bytes per second) from a device, in the form `[{"Path": "device_path", "Rate": rate}]`.

            '
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
        BlkioDeviceWriteBps:
          description: 'Limit write rate (bytes per second) to a device, in the form `[{"Path": "device_path", "Rate": rate}]`.

            '
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
        BlkioDeviceReadIOps:
          description: 'Limit read rate (IO per second) from a device, in the form `[{"Path": "device_path", "Rate": rate}]`.

            '
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
        BlkioDeviceWriteIOps:
          description: 'Limit write rate (IO per second) to a device, in the form `[{"Path": "device_path", "Rate": rate}]`.

            '
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
        CpuPeriod:
          description: The length of a CPU period in microseconds.
          type: integer
          format: int64
        CpuQuota:
          description: Microseconds of CPU time that the container can get in a CPU period.
          type: integer
          format: int64
        CpuRealtimePeriod:
          description: The length of a CPU real-time period in microseconds. Set to 0 to allocate no time allocated to real-time tasks.
          type: integer
          format: int64
        CpuRealtimeRuntime:
          description: The length of a CPU real-time runtime in microseconds. Set to 0 to allocate no time allocated to real-time tasks.
          type: integer
          format: int64
        CpusetCpus:
          description: CPUs in which to allow execution (e.g., `0-3`, `0,1`)
          type: string
          example: 0-3
        CpusetMems:
          description: Memory nodes (MEMs) in which to allow execution (0-3, 0,1). Only effective on NUMA systems.
          type: string
        Devices:
          description: A list of devices to add to the container.
          type: array
          items:
            $ref: '#/components/schemas/DeviceMapping'
        DeviceCgroupRules:
          description: a list of cgroup rules to apply to the container
          type: array
          items:
            type: string
            example: c 13:* rwm
        DiskQuota:
          description: Disk limit (in bytes).
          type: integer
          format: int64
        KernelMemory:
          description: Kernel memory limit in bytes.
          type: integer
          format: int64
        MemoryReservation:
          description: Memory soft limit in bytes.
          type: integer
          format: int64
        MemorySwap:
          description: Total memory limit (memory + swap). Set as `-1` to enable unlimited swap.
          type: integer
          format: int64
        MemorySwappiness:
          description: Tune a container's memory swappiness behavior. Accepts an integer between 0 and 100.
          type: integer
          format: int64
          minimum: 0
          maximum: 100
        NanoCPUs:
          description: CPU quota in units of 10<sup>-9</sup> CPUs.
          type: integer
          format: int64
        OomKillDisable:
          description: Disable OOM Killer for the container.
          type: boolean
        PidsLimit:
          description: Tune a container's pids limit. Set -1 for unlimited.
          type: integer
          format: int64
        Ulimits:
          description: 'A list of resource limits to set in the container. For example: `{"Name": "nofile", "Soft": 1024, "Hard": 2048}`"

            '
          type: array
          items:
            type: object
            properties:
              Name:
                description: Name of ulimit
                type: string
              Soft:
                description: Soft limit
                type: integer
              Hard:
                description: Hard limit
                type: integer
        CpuCount:
          description: 'The number of usable CPUs (Windows only).


            On Windows Server containers, the processor resource controls are mutually exclusive. The order of precedence is `CPUCount` first, then `CPUShares`, and `CPUPercent` last.

            '
          type: integer
          format: int64
        CpuPercent:
          description: 'The usable percentage of the available CPUs (Windows only).


            On Windows Server containers, the processor resource controls are mutually exclusive. The order of precedence is `CPUCount` first, then `CPUShares`, and `CPUPercent` last.

            '
          type: integer
          format: int64
        IOMaximumIOps:
          description: Maximum IOps for the container system drive (Windows only)
          type: integer
          format: int64
        IOMaximumBandwidth:
          description: Maximum IO in bytes per second for the container system drive (Windows only)
          type: integer
          format: int64
    GraphDriverData:
