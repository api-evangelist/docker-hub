openapi: 3.2.0
info:
  title: Docker Engine System API
  version: '1.33'
  x-logo:
    url: https://docs.docker.com/images/logo-docker-main.png
  description: 'The Engine API is an HTTP API served by Docker Engine. It is the API the Docker client uses to communicate with the Engine, so everything the Docker client can do can be done with the API.


    Most of the client''s commands map directly to API endpoints (e.g. `docker ps` is `GET /containers/json`). The notable exception is running containers, which consists of several API calls.


    # Errors


    The API uses standard HTTP status codes to indicate the success or failure of the API call. The body of the response will be JSON in the following format:


    ```

    {

    "message": "page not found"

    }

    ```


    # Versioning


    The API is usually changed in each release of Docker, so API calls are versioned to ensure that clients don''t break.


    For Docker Engine 17.09, the API version is 1.32. To lock to this version, you prefix the URL with `/v1.32`. For example, calling `/info` is the same as calling `/v1.32/info`.


    Engine releases in the near future should support this version of the API, so your client will continue to work even if it is talking to a newer Engine.


    In previous versions of Docker, it was possible to access the API without providing a version. This behaviour is now deprecated will be removed in a future version of Docker.


    The API uses an open schema model, which means server may add extra properties to responses. Likewise, the server will ignore any extra query parameters and request body properties. When you write clients, you need to ignore additional properties in responses to ensure they do not break when talking to newer Docker daemons.


    This documentation is for version 1.33 of the API. Use this table to find documentation for previous versions of the API:


    Docker version | API version | Changes

    ----------------|-------------|---------

    17.09.x | 1.31 | API changes

    17.07.x | 1.31 | API changes

    17.06.x | 1.30 | API changes

    17.05.x | 1.29 | API changes

    17.04.x | 1.28 | API changes

    17.03.1 | 1.27 | API changes

    1.13.1 & 17.03.0 | 1.26 | API changes

    1.13.0 | 1.25 | API changes

    1.12.x | 1.24 | API changes

    1.11.x | 1.23 | API changes

    1.10.x | 1.22 | API changes

    1.9.x | 1.21 | API changes

    1.8.x | 1.20 | API changes

    1.7.x | 1.19 | API changes

    1.6.x | 1.18 | API changes


    # Authentication


    Authentication for registries is handled client side. The client has to send authentication details to various endpoints that need to communicate with registries, such as `POST /images/(name)/push`. These are sent as `X-Registry-Auth` header as a Base64 encoded (JSON) string with the following structure:


    ```

    {

    "username": "string",

    "password": "string",

    "email": "string",

    "serveraddress": "string"

    }

    ```


    The `serveraddress` is a domain/IP without a protocol. Throughout this structure, double quotes are required.


    If you have already got an identity token from the `/auth` endpoint, you can just pass this instead of credentials:


    ```

    {

    "identitytoken": "9cbaf023786cd7..."

    }

    ```'
servers:
- url: /v1.33
tags:
- name: System
  x-displayName: System
paths:
  /auth:
    post:
      summary: Check auth configuration
      description: Validate credentials for a registry and, if available, get an identity token for accessing the registry without password.
      operationId: SystemAuth
      responses:
        200:
          description: An identity token was generated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - Status
                properties:
                  Status:
                    description: The status of the authentication
                    type: string
                  IdentityToken:
                    description: An opaque token used to authenticate a user after a successful login
                    type: string
              example:
                Status: Login Succeeded
                IdentityToken: 9cbaf023786cd7...
        204:
          description: No error
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - System
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthConfig'
        description: Authentication to check
  /info:
    get:
      summary: Get system information
      operationId: SystemInfo
      responses:
        200:
          description: No error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - System
  /version:
    get:
      summary: Get version
      description: Returns the version of Docker that is running and various information about the system that Docker is running on.
      operationId: SystemVersion
      responses:
        200:
          description: no error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Version:
                    type: string
                  ApiVersion:
                    type: string
                  MinAPIVersion:
                    type: string
                  GitCommit:
                    type: string
                  GoVersion:
                    type: string
                  Os:
                    type: string
                  Arch:
                    type: string
                  KernelVersion:
                    type: string
                  Experimental:
                    type: boolean
                  BuildTime:
                    type: string
              example:
                Version: 17.04.0
                Os: linux
                KernelVersion: 3.19.0-23-generic
                GoVersion: go1.7.5
                GitCommit: deadbee
                Arch: amd64
                ApiVersion: '1.27'
                MinAPIVersion: '1.12'
                BuildTime: '2016-06-14T07:09:13.444803460+00:00'
                Experimental: true
        500:
          description: server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - System
  /_ping:
    get:
      summary: Ping
      description: This is a dummy endpoint you can use to test if the server is accessible.
      operationId: SystemPing
      responses:
        200:
          description: no error
          headers:
            API-Version:
              description: Max API Version the server supports
              schema:
                type: string
            Docker-Experimental:
              description: If the server is running with experimental mode enabled
              schema:
                type: boolean
          content:
            text/plain:
              schema:
                type: string
                example: OK
        500:
          description: server error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - System
  /events:
    get:
      summary: Monitor events
      description: 'Stream real-time events from the server.


        Various objects within Docker report events when something happens to them.


        Containers report these events: `attach`, `commit`, `copy`, `create`, `destroy`, `detach`, `die`, `exec_create`, `exec_detach`, `exec_start`, `export`, `health_status`, `kill`, `oom`, `pause`, `rename`, `resize`, `restart`, `start`, `stop`, `top`, `unpause`, and `update`


        Images report these events: `delete`, `import`, `load`, `pull`, `push`, `save`, `tag`, and `untag`


        Volumes report these events: `create`, `mount`, `unmount`, and `destroy`


        Networks report these events: `create`, `connect`, `disconnect`, `destroy`, `update`, and `remove`


        The Docker daemon reports these events: `reload`


        Services report these events: `create`, `update`, and `remove`


        Nodes report these events: `create`, `update`, and `remove`


        Secrets report these events: `create`, `update`, and `remove`


        Configs report these events: `create`, `update`, and `remove`'
      operationId: SystemEvents
      responses:
        200:
          description: no error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Type:
                    description: The type of object emitting the event
                    type: string
                  Action:
                    description: The type of event
                    type: string
                  Actor:
                    type: object
                    properties:
                      ID:
                        description: The ID of the object emitting the event
                        type: string
                      Attributes:
                        description: Various key/value attributes of the object, depending on its type
                        type: object
                        additionalProperties:
                          type: string
                  time:
                    description: Timestamp of event
                    type: integer
                  timeNano:
                    description: Timestamp of event, with nanosecond accuracy
                    type: integer
                    format: int64
              example:
                Type: container
                Action: create
                Actor:
                  ID: ede54ee1afda366ab42f824e8a5ffd195155d853ceaec74a927f249ea270c743
                  Attributes:
                    com.example.some-label: some-label-value
                    image: alpine
                    name: my-container
                time: 1461943101
        400:
          description: bad parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: since
        in: query
        description: Show events created since this timestamp then stream new events.
        schema:
          type: string
      - name: until
        in: query
        description: Show events created until this timestamp then stop streaming.
        schema:
          type: string
      - name: filters
        in: query
        description: 'A JSON encoded value of filters (a `map[string][]string`) to process on the event list. Available filters:


          - `config=<string>` config name or ID

          - `container=<string>` container name or ID

          - `daemon=<string>` daemon name or ID

          - `event=<string>` event type

          - `image=<string>` image name or ID

          - `label=<string>` image or container label

          - `network=<string>` network name or ID

          - `node=<string>` node ID

          - `plugin`=<string> plugin name or ID

          - `scope`＝<string> local or swarm

          - `secret=<string>` secret name or ID

          - `service=<string>` service name or ID

          - `type=<string>` object to filter by, one of `container`, `image`, `volume`, `network`, `daemon`, `plugin`, `node`, `service`, `secret` or `config`

          - `volume=<string>` volume name

          '
        schema:
          type: string
      tags:
      - System
  /system/df:
    get:
      summary: Get data usage information
      operationId: SystemDataUsage
      responses:
        200:
          description: no error
          content:
            application/json:
              schema:
                type: object
                properties:
                  LayersSize:
                    type: integer
                    format: int64
                  Images:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageSummary'
                  Containers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContainerSummary'
                  Volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Volume'
                example:
                  LayersSize: 1092588
                  Images:
                  - Id: sha256:2b8fd9751c4c0f5dd266fcae00707e67a2545ef34f9a29354585f93dac906749
                    ParentId: ''
                    RepoTags:
                    - busybox:latest
                    RepoDigests:
                    - busybox@sha256:a59906e33509d14c036c8678d687bd4eec81ed7c4b8ce907b888c607f6a1e0e6
                    Created: 1466724217
                    Size: 1092588
